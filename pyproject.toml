[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cacc"
dynamic = ["version"]
description = "String-stability and V2X-robustness test engine for longitudinal vehicle controllers (ACC / CACC / platooning)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "control>=0.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebooks = ["jupyterlab", "ipykernel"]

[project.scripts]
cacc = "cacc.cli:main"

[tool.setuptools.dynamic]
version = {attr = "cacc.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
